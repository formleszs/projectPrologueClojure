<div id="game-container"></div>
<div id="status"></div>
<button id="start-btn" onclick="startGame()" style="display:none;"></button>

<style>
  #game-container {
    display: grid;
    grid-template-columns: repeat(var(--width), 20px);
    grid-template-rows: repeat(var(--height), 20px);
    gap: 1px;
  }
  .cell { width: 20px; height: 20px; border: 1px solid #ccc; }
  .wall { background: #333; }
  .empty { background: #fff; }
  .player { background: var(--color); border-radius: 50%; }
  .bot { background: #000; }
  .exit { background: gold; }
</style>
<script>
  const ws = new WebSocket(`ws://${location.host}/ws`);

  let lastState = null;

function normalizeStatus(s) {
  // сервер может прислать "playing" или ":playing" и т.п.
  if (typeof s !== "string") return "";
  return s.startsWith(":") ? s.slice(1) : s;
}

function startGame() {
  if (!lastState) return;

  const gs = normalizeStatus(lastState["game-status"]);
  if (gs === "waiting") {
    ws.send(JSON.stringify({ type: "start" }));
  } else if (gs === "won" || gs === "lost") {
    ws.send(JSON.stringify({ type: "restart" }));
  }
}
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === "state-update") {
      lastState = data.state;
      renderGame(data.state);
      }
    if (data.type === "chat") console.log(`[${data.player}] ${data.message}`);
  };

  function renderGame(state) {
    const container = document.getElementById("game-container");
    const [width, height] = state.maze.size;

    container.style.setProperty("--width", width);
    container.style.setProperty("--height", height);
    container.innerHTML = "";

    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const cell = document.createElement("div");
        cell.className = "cell";

        const isWall = state.maze.walls.some((w) => w[0] === x && w[1] === y);
        cell.classList.add(isWall ? "wall" : "empty");

        const exit = state.maze.exit; // ожидаем [x,y]
        if (exit && exit[0] === x && exit[1] === y) cell.classList.add("exit");

        container.appendChild(cell);
      }
    }

    // players
    Object.entries(state.players || {}).forEach(([id, player]) => {
  if (!player) return; 

  const status = (player.status === ":alive") ? "alive" : player.status;
    const btn = document.getElementById("start-btn");
    const gs = normalizeStatus(state["game-status"]);

    if (gs === "waiting") {
      btn.style.display = "inline-block";
      btn.textContent = "Start game";
    } else if (gs === "won") {
      btn.style.display = "inline-block";
      btn.textContent = "Play again";
    } else if (gs === "lost") {
      btn.style.display = "inline-block";
      btn.textContent = "Restart";
    } else {
      btn.style.display = "none";
    }
  if (status === "alive") {
    const idx = player.y * width + player.x;
    const cell = container.children[idx];
    if (cell) {
      cell.classList.add("player");
      cell.style.setProperty("--color", player.color || "#f0f");
    }
  }
});

    // bot
    const bot = state.bot;
    const botIdx = bot.y * width + bot.x;
    if (container.children[botIdx]) container.children[botIdx].classList.add("bot");

    const alive = Object.values(state.players || {})
      .filter(p => p && (p.status === "alive" || p.status === ":alive"))
      .length;
    document.getElementById("status").textContent =
       Game: ${state["game-status"]} | Players: ${alive};
    }

  document.addEventListener("keydown", (e) => {
    const direction = ({
      ArrowUp: "up",
      ArrowDown: "down",
      ArrowLeft: "left",
      ArrowRight: "right",
    })[e.key];

    if (!direction) return;

    const gs = normalizeStatus(lastState?.["game-status"]);
    if (gs !== "playing") return;

    ws.send(JSON.stringify({ type: "move", direction }));
  });

  function sendMessage() {
    const msgEl = document.getElementById("message");
    const msg = msgEl.value.trim();
    if (!msg) return;
    ws.send(JSON.stringify({ type: "chat", message: msg }));
    msgEl.value = "";
  }
</script>
